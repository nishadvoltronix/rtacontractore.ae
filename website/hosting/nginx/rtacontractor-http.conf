# REVIEW CANDIDATE, not installed. Include once inside nginx's http {} context.
# Requires ngx_http_realip_module. Use the original socket peer even if another
# real_ip rule has replaced $remote_addr with a visitor's address.
geo $realip_remote_addr $rta_trusted_redirect_peer {
    default 0;
    include rtacontractor-trusted-proxies.conf;
}

# A trusted ingress must overwrite this header with ONE public scheme.
# Comma-separated, missing or invalid values from that peer fail closed.
# Untrusted Forwarded/X-Forwarded-* values never determine redirects.
map "$rta_trusted_redirect_peer:$http_x_forwarded_proto" $rta_public_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
    ~^1: invalid;
}

# Never construct the destination authority from request headers.
# Explicit nonpublic ports and unrelated hosts are rejected in this site's block.
map $http_host $rta_public_host {
    default invalid;
    ~*^rtacontractor\.ae(?::443)?$ apex;
    ~*^(?:rtacontractor\.ae:80|www\.rtacontractor\.ae(?::(?:80|443))?)$ alias;
}

# Match the ORIGINAL request, not $uri: nginx's internal index processing changes
# $uri to /index.html and using it here would create a canonical redirect loop.
# Only published page aliases are collapsed; unknown routes remain real 404s.
map $request_uri $rta_page_alias {
    default "";
    ~^/index\.html(?<rta_home_query>\?.*)?$ /$rta_home_query;
    ~^/(?<rta_page>privacy|photography|services/(?:street-lighting|underground-cabling|electrical-infrastructure|high-mast-area-lighting|led-solar-lighting|lighting-maintenance))(?:/index\.html)?(?<rta_page_query>\?.*)?$ /$rta_page/$rta_page_query;
}

map $rta_page_alias $rta_canonical_request {
    "" $request_uri;
    default $rta_page_alias;
}

map "$rta_public_host:$rta_public_scheme:$rta_page_alias" $rta_needs_redirect {
    default 1;
    "apex:https:" 0;
}
