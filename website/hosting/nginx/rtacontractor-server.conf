# REVIEW CANDIDATE, not installed. Include ONLY in the existing server block(s)
# for rtacontractor.ae and www.rtacontractor.ae, before site location blocks.
# Preserve existing listen/TLS/root/proxy/cache/security/error/PDF configuration.
if ($rta_public_host = invalid) { return 421; }
if ($rta_public_scheme = invalid) { return 400; }

# Host, public scheme and known path alias are normalized in ONE response.
if ($rta_needs_redirect) {
    return 308 https://rtacontractor.ae$rta_canonical_request;
}

# Prevent incidental nginx directory redirects from exposing its HTTP listener
# or service port. Explicit canonical redirects above remain absolute HTTPS.
absolute_redirect off;
port_in_redirect off;
